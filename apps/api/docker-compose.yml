networks:
  taskmesh-net:
    name: taskmesh-net
    driver: bridge

volumes:
  pgdata:

services:
  db:
    image: postgres:17-alpine
    container_name: taskmesh-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-taskmesh}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Optional: auto-run scripts on startup
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - taskmesh-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

